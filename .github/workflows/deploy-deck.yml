name: Deploy Slide Deck

on:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - '.github/workflows/deploy-deck.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deck/package.json

      - name: Install dependencies
        working-directory: deck
        run: npm install

      - name: Build deck
        working-directory: deck
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deck/dist
          # v4 started excluding dotfiles from the artifact. The Slidev build
          # can emit them (.nojekyll and friends), so keep the v3 behavior
          # rather than silently shipping a different set of files.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
